name: recipe-planner-backend

on:
  push:
    paths:
      - "9 - CI-CD Pipelines/recipe-planner-backend/**"
      - ".github/workflows/recipe-planner.yml"
  pull_request:
    paths:
      - "9 - CI-CD Pipelines/recipe-planner-backend/**"
      - ".github/workflows/recipe-planner.yml"
  workflow_dispatch:

env:
  BACKEND_DIR: "9 - CI-CD Pipelines/recipe-planner-backend"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

defaults:
  run:
    working-directory: "9 - CI-CD Pipelines/recipe-planner-backend"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - name: Compile
        run: ./mvnw $MAVEN_CLI_OPTS compile

  test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - name: Unit Tests
        run: ./mvnw $MAVEN_CLI_OPTS verify
      - name: Reports auch bei roten Tests erzeugen
        if: failure()
        run: ./mvnw $MAVEN_CLI_OPTS surefire-report:report-only jacoco:report
      - name: Testresultate in der Job-Summary
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "${{ env.BACKEND_DIR }}/target/surefire-reports/TEST-*.xml"
          detailed_summary: true
          include_passed: true
      - name: Reports als Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            ${{ env.BACKEND_DIR }}/target/surefire-reports/
            ${{ env.BACKEND_DIR }}/target/site/
      - name: Reports für Pages zusammenstellen
        if: always()
        run: |
          mkdir -p public
          cp -r target/site/. public/
          cat > public/index.html <<EOF
          <!doctype html>
          <html lang="de">
          <head><meta charset="utf-8"><title>Recipe Planner Reports</title></head>
          <body>
            <h1>Recipe Planner Backend – Reports</h1>
            <p>Lauf #${{ github.run_number }}, Commit ${{ github.sha }}</p>
            <ul>
              <li><a href="surefire-report.html">Surefire Testreport</a></li>
              <li><a href="jacoco/index.html">JaCoCo Coverage</a></li>
            </ul>
          </body>
          </html>
          EOF
      - name: Pages-Artifact hochladen
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "${{ env.BACKEND_DIR }}/public"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
